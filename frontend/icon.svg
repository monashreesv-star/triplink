<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="tripGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="url(#tripGrad)" />
  
  <!-- Subtle Glow Orbit -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="8" stroke-dasharray="16 12" />
  
  <!-- Link Nodes / Network Ring -->
  <g fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round">
    <!-- Link 1 -->
    <path d="M210 240 L170 280 A42 42 0 0 1 110 220 L150 180 A42 42 0 0 1 210 180" />
    <!-- Link 2 -->
    <path d="M302 272 L342 232 A42 42 0 0 1 402 292 L362 332 A42 42 0 0 1 302 332" />
    <!-- Connecting bridge -->
    <line x1="185" y1="265" x2="327" y2="247" stroke="url(#accentGrad)" stroke-width="26" />
  </g>

  <!-- Jet Flight Vector -->
  <path d="M290 140 L370 120 L350 200 L395 245 L415 235 L405 285 L355 275 L310 320 L270 270 L320 220 Z" fill="#ffffff" opacity="0.95" />
</svg>
